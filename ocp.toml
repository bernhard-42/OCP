module_mapping = "lambda x: Path(x).splitpath()[-1].split('.')[0].split('_')[0]"

byref_types = ["double","int","bool"]
byref_types_smart_ptr = ["opencascade::handle", "occ::handle", "handle", "Handle"]

parsing_header = '''#pragma clang diagnostic ignored "-Wmacro-redefined"
class Adaptor2d_Curve2d;
class Adaptor3d_Curve;
class Adaptor3d_Surface;
#include <Standard_Handle.hxx>
#undef Standard_NODISCARD
#define Standard_NODISCARD
'''

[Linux]
    modules = ["Xw"]
    symbols = "symbols_mangled_linux.dat"

[Windows]
    modules = ["WNT"]
    exclude_classes = ["Handle_*"]
    symbols = "symbols_mangled_win.dat"

[OSX]
    modules = ["Cocoa"]
    symbols = "symbols_mangled_mac.dat"
    # prefix is not used on ARM Mac (SDK paths passed via -i includes instead)
    # prefix = ""
    includes = []

[Operators]

    "operator*" = ["__mul__","__rmul__"]
    "operator*=" = ["__imul__"]
    "operator/" = ["__truediv__"]
    "operator/=" = ["__itruediv__"]
    "operator+" = ["__add__"]
    "operator+=" = ["__iadd__"]
    "operator-" = ["__sub__"]
    "operator-=" = ["__isub__"]
    "operator^" = ["__pow__"]
    "operator^=" = ["__ipow__"]
    "operator()" = ["__call__"]

[Extras]

    include_pre = "OCP_specific.inc"

[Attributes]

    __version__ = "8.0.0.0"

[Modules]

    [Modules.gp]

        exclude_typedefs = ["gp","gp_TrsfNLerp"]

    [Modules.math]

        exclude_methods = ["math_Matrix::operator="]

    [Modules.MathLin]
        # OCCT rc5 bug: MathLin::EigenResult lacks NbIterations (MathLin_Jacobi.hxx:90 uses it).
        # Also, Clang resolves return type as MathUtils::EigenResult instead of MathLin::EigenResult
        # due to 'using namespace MathUtils', causing static_cast failures.
        exclude_functions = ["Jacobi", "EigenValues", "SpectralDecomposition"]

    [Modules.MathSys]
        # detail::Solve3x3/Solve4x4 take const double(*)[N] — pybind11 can't cast fixed-size array pointers
        exclude_functions = ["Solve3x3", "Solve4x4"]

    [Modules.BRepGraphInc]
        # Options is auto-discovered by pywrap's nested-class descent.
        # The same type is manually registered in Modules.BRepGraph (above)
        # because BRepGraph loads alphabetically first and binds it as a
        # default-arg value.  Skip auto-registration here to avoid the
        # duplicate.
        exclude_classes = ["BRepGraphInc_Populate::Options"]

    [Modules.GeomLProp]
        # Namespace-scoped class template that pywrap can't qualify
        exclude_class_templates = ["ToolAccess"]

    [Modules.Standard]

        exclude_functions = ["HashCode"]
        exclude_methods = ["Standard_Dump::DumpCharacterValues","Standard_Dump::DumpRealValues",
            "Standard_CLocaleSentry::GetCLocale","Standard_Dump::InitRealValues", "Standard_ErrorHandler::Label",
            "Standard_ErrorHandler::Abort", "Standard_ErrorHandler::Error"]

    [Modules.Resource]

        exclude_classes = ["Resource_NoSuchResource",]

    [Modules.NCollection]

        include_header_pre_top = """#include <gp_XYZ.hxx>
#include <gp_XY.hxx>"""
        include_header_pre = """const size_t DefaultBlockSize = 24600;
const size_t THE_DEFAULT_BLOCK_SIZE = DefaultBlockSize;"""
        exclude_classes = ["NCollection","NCollection_ListNode",
            "NCollection_ForwardRange"]
        # NCollection_IndexedDataMap::Contained: OCCT rc5 bug (calls aNode->Key() but node has Key1())
        # All Contained methods: return std::optional<std::reference_wrapper<const T>> which
        # pybind11 can't cast when T is opencascade::handle<U>. Users can use Contains()+Find() instead.
        # NCollection_Sequence constructor from initializer_list: pybind11 can't handle std::initializer_list<T> in py::init<>
        exclude_class_template_methods = [".*::begin", ".*::end", ".*::cbegin", ".*::cend",
            ".*::Contained",
            ".*::Bound", ".*::Seek", ".*::ChangeSeek",
            "NCollection_List::NCollection_List"]

        include_body_template_post="""
template <typename T>
void preregister_template_NCollection_Vector(py::object &m, const char *name){
    preregister_template_NCollection_DynamicArray<T>(m, name);
};

template <typename T>
void register_template_NCollection_Vector(py::object &m, const char *name){
    register_template_NCollection_DynamicArray<T>(m, name);
};
        """

        [Modules.NCollection.Templates.NCollection_Array1]

        exclude_constructors = [3]

        [Modules.NCollection.Templates.NCollection_HArray1]

        include_superclass_templates = ["NCollection_Array1"]

        [Modules.NCollection.Templates.NCollection_HArray2]

        include_superclass_templates = ["NCollection_Array2"]

        [Modules.NCollection.Templates.NCollection_HSequence]

        include_superclass_templates = ["NCollection_Sequence"]

        [Modules.NCollection.Templates.NCollection_LinearVector]

        [Modules.NCollection.parsing_headers]

            "NCollection_CellFilter.hxx" = """#include <gp_XYZ.hxx>
#include <gp_XY.hxx>"""
            "NCollection_PackedMapAlgo.hxx" = "#include <NCollection_PackedMap.hxx>"

    [Modules.BRepGraph]
        # BRepGraphInc_Populate::Options is a nested struct used as default arg
        # in BRepGraph methods. Must be registered here (not BRepGraphInc) because
        # BRepGraph loads before BRepGraphInc alphabetically.
        include_header_pre_top = "#include <BRepGraphInc_Populate.hxx>"
        include_body_pre = """
    py::class_<BRepGraphInc_Populate::Options>(m, "BRepGraphInc_Populate_Options")
        .def(py::init<>())
        .def_readwrite("ExtractRegularities", &BRepGraphInc_Populate::Options::ExtractRegularities)
        .def_readwrite("ExtractVertexPointReps", &BRepGraphInc_Populate::Options::ExtractVertexPointReps);
"""
        exclude_class_templates = ["HasIsRemoved"]
        [Modules.BRepGraph.parsing_headers]
            "BRepGraph_MutGuard.hxx" = """#include <BRepGraph.hxx>
#include <BRepGraphInc_Definition.hxx>"""
            "BRepGraph_CacheKindIterator.hxx" = "#include <BRepGraph.hxx>"
            # Inject NCollection_DynamicArray<X> typedef aliases for every typed ID
            # and BRepGraphInc::*Def/*Ref struct that BRepGraph methods use
            # in their return types.  These typedefs aren't declared in the
            # OCCT 8.0 BRepGraph headers (the templates are used inline in
            # method signatures), so without injecting them pywrap doesn't
            # see them, doesn't emit the matching
            # `preregister_template_NCollection_DynamicArray<T>(m, "...")` calls,
            # and pybind11 raises `TypeError: Unable to convert function
            # return value` at runtime when those methods are invoked.
            #
            # Naming convention follows OCCT (`<Module>_VectorOf<TypeShortName>`).
            # Compile-time visibility of the typedef NAMES is irrelevant; the
            # generated calls reference the underlying C++ type (e.g.
            # `BRepGraph_FaceId`), which is already visible through the
            # existing `#include <BRepGraph.hxx>` in BRepGraph_pre.cpp.
            "BRepGraph.hxx" = """
#include <BRepGraph_TopoView.hxx>
#include <BRepGraph_RefsView.hxx>
#include <BRepGraph_EditorView.hxx>
#include <BRepGraph_HistoryRecord.hxx>
#include <BRepGraph_NodeId.hxx>
#include <BRepGraph_RefId.hxx>
#include <BRepGraph_RefUID.hxx>
#include <BRepGraph_UID.hxx>
#include <BRepGraphInc_Definition.hxx>
#include <BRepGraphInc_Reference.hxx>
#include <NCollection_DynamicArray.hxx>

using BRepGraph_VectorOfFaceId       = NCollection_DynamicArray<BRepGraph_FaceId>;
using BRepGraph_VectorOfEdgeId       = NCollection_DynamicArray<BRepGraph_EdgeId>;
using BRepGraph_VectorOfVertexId     = NCollection_DynamicArray<BRepGraph_VertexId>;
using BRepGraph_VectorOfWireId       = NCollection_DynamicArray<BRepGraph_WireId>;
using BRepGraph_VectorOfShellId      = NCollection_DynamicArray<BRepGraph_ShellId>;
using BRepGraph_VectorOfSolidId      = NCollection_DynamicArray<BRepGraph_SolidId>;
using BRepGraph_VectorOfCoEdgeId     = NCollection_DynamicArray<BRepGraph_CoEdgeId>;
using BRepGraph_VectorOfCompoundId   = NCollection_DynamicArray<BRepGraph_CompoundId>;
using BRepGraph_VectorOfCompSolidId  = NCollection_DynamicArray<BRepGraph_CompSolidId>;
using BRepGraph_VectorOfProductId    = NCollection_DynamicArray<BRepGraph_ProductId>;
using BRepGraph_VectorOfOccurrenceId = NCollection_DynamicArray<BRepGraph_OccurrenceId>;
using BRepGraph_VectorOfNodeId       = NCollection_DynamicArray<BRepGraph_NodeId>;

using BRepGraph_VectorOfRefId           = NCollection_DynamicArray<BRepGraph_RefId>;
using BRepGraph_VectorOfChildRefId      = NCollection_DynamicArray<BRepGraph_ChildRefId>;
using BRepGraph_VectorOfFaceRefId       = NCollection_DynamicArray<BRepGraph_FaceRefId>;
using BRepGraph_VectorOfCoEdgeRefId     = NCollection_DynamicArray<BRepGraph_CoEdgeRefId>;
using BRepGraph_VectorOfShellRefId      = NCollection_DynamicArray<BRepGraph_ShellRefId>;
using BRepGraph_VectorOfSolidRefId      = NCollection_DynamicArray<BRepGraph_SolidRefId>;
using BRepGraph_VectorOfVertexRefId     = NCollection_DynamicArray<BRepGraph_VertexRefId>;
using BRepGraph_VectorOfWireRefId       = NCollection_DynamicArray<BRepGraph_WireRefId>;
using BRepGraph_VectorOfOccurrenceRefId = NCollection_DynamicArray<BRepGraph_OccurrenceRefId>;

using BRepGraph_VectorOfUID    = NCollection_DynamicArray<BRepGraph_UID>;
using BRepGraph_VectorOfRefUID = NCollection_DynamicArray<BRepGraph_RefUID>;

using BRepGraph_VectorOfHistoryRecord = NCollection_DynamicArray<BRepGraph_HistoryRecord>;

using BRepGraph_VectorOfTriangulationRepId = NCollection_DynamicArray<BRepGraph_TriangulationRepId>;
using BRepGraph_VectorOfPolygonOnTriRepId  = NCollection_DynamicArray<BRepGraph_PolygonOnTriRepId>;

using BRepGraphInc_VectorOfFaceDef       = NCollection_DynamicArray<BRepGraphInc::FaceDef>;
using BRepGraphInc_VectorOfEdgeDef       = NCollection_DynamicArray<BRepGraphInc::EdgeDef>;
using BRepGraphInc_VectorOfCoEdgeDef     = NCollection_DynamicArray<BRepGraphInc::CoEdgeDef>;
using BRepGraphInc_VectorOfWireDef       = NCollection_DynamicArray<BRepGraphInc::WireDef>;
using BRepGraphInc_VectorOfShellDef      = NCollection_DynamicArray<BRepGraphInc::ShellDef>;
using BRepGraphInc_VectorOfSolidDef      = NCollection_DynamicArray<BRepGraphInc::SolidDef>;
using BRepGraphInc_VectorOfCompoundDef   = NCollection_DynamicArray<BRepGraphInc::CompoundDef>;
using BRepGraphInc_VectorOfCompSolidDef  = NCollection_DynamicArray<BRepGraphInc::CompSolidDef>;
using BRepGraphInc_VectorOfOccurrenceDef = NCollection_DynamicArray<BRepGraphInc::OccurrenceDef>;

using BRepGraphInc_VectorOfFaceRef   = NCollection_DynamicArray<BRepGraphInc::FaceRef>;
using BRepGraphInc_VectorOfCoEdgeRef = NCollection_DynamicArray<BRepGraphInc::CoEdgeRef>;
using BRepGraphInc_VectorOfShellRef  = NCollection_DynamicArray<BRepGraphInc::ShellRef>;
using BRepGraphInc_VectorOfSolidRef  = NCollection_DynamicArray<BRepGraphInc::SolidRef>;
using BRepGraphInc_VectorOfVertexRef = NCollection_DynamicArray<BRepGraphInc::VertexRef>;
using BRepGraphInc_VectorOfChildRef  = NCollection_DynamicArray<BRepGraphInc::ChildRef>;

// --- #16: nested helper-type vectors on public API surface ---------------
#include <BRepGraph_Validate.hxx>
#include <BRepGraph_LayerRegularity.hxx>
#include <BRepGraph_LayerParam.hxx>

using BRepGraph_Validate_VectorOfIssue                      = NCollection_DynamicArray<BRepGraph_Validate::Issue>;
using BRepGraph_EditorView_VectorOfBoundaryIssue            = NCollection_DynamicArray<BRepGraph::EditorView::BoundaryIssue>;
using BRepGraph_LayerRegularity_VectorOfRegularityEntry     = NCollection_DynamicArray<BRepGraph_LayerRegularity::RegularityEntry>;
using BRepGraph_LayerParam_VectorOfPointOnCurveEntry        = NCollection_DynamicArray<BRepGraph_LayerParam::PointOnCurveEntry>;
using BRepGraph_LayerParam_VectorOfPointOnPCurveEntry       = NCollection_DynamicArray<BRepGraph_LayerParam::PointOnPCurveEntry>;
using BRepGraph_LayerParam_VectorOfPointOnSurfaceEntry      = NCollection_DynamicArray<BRepGraph_LayerParam::PointOnSurfaceEntry>;

// --- #17: ForwardRangeIterator / DataMap typedefs deferred ---------------
// NCollection_DataMap<...> uses in BRepGraph headers are all private fields.
// NCollection_ForwardRangeIterator<X> typedefs tempting but trigger a
// pre-existing pywrap codegen bug: the instantiation of the template's
// operator* emission references `typename NCollection_ForwardRangeIterator
// <HostType>::RawReturn`, which is a PRIVATE member typedef — compile error
// ("is a private member").  The latent bug is unrelated to BRepGraph; it
// affects any attempt to instantiate the template.  Python `for x in obj`
// iteration still works via pywrap's `__iter__` / `py::make_iterator`
// mechanism (doesn't need the iterator type registered).  Adding typedefs
// here is blocked until the RawReturn codegen bug is resolved upstream
// (filter private typedefs from method-pointer emission).
"""

    [Modules.Extrema]
        [Modules.Extrema.parsing_headers]
            "Extrema_GLocateExtPC.hxx" = "#include <GeomAbs_Shape.hxx>"
            "Extrema_GGExtPC.hxx" = "#include <GeomAbs_Shape.hxx>"

    [Modules.GeomGridEval]
        [Modules.GeomGridEval.parsing_headers]
            "GeomGridEval_Line.hxx" = "#include <gp_Lin.hxx>"

    [Modules.Geom2dGridEval]
        [Modules.Geom2dGridEval.parsing_headers]
            "Geom2dGridEval_Line.hxx" = "#include <gp_Lin2d.hxx>"

    [Modules.OSD]

        exclude_functions = ["OSD","OSD_OpenStream"]
        exclude_classes = ["OSD","OSD_FileSystem","OSD_CachedFileSystem","OSD_FileSystemSelector","OSD_LocalFileSystem"]
        exclude_methods = ["OSD_SharedLibrary::DlSymb"]
        #"OSD_FileSystem::IsOpenIStream","OSD_FileSystem::IsOpenOStream","OSD_FileSystem::OpenOStream","OSD_FileSystem::OpenIStream",
        #"OSD_CachedFileSystem::IsOpenIStream","OSD_CachedFileSystem::IsOpenOStream","OSD_CachedFileSystem::OpenOStream","OSD_CachedFileSystem::OpenIStream",
        #"OSD_FileSystemSelector::IsOpenIStream","OSD_FileSystemSelector::IsOpenOStream","OSD_FileSystemSelector::OpenOStream","OSD_FileSystemSelector::OpenIStream",
        #"OSD_LocalFileSystem::IsOpenIStream","OSD_LocalFileSystem::IsOpenOStream","OSD_LocalFileSystem::OpenOStream","OSD_LocalFileSystem::OpenIStream"]

